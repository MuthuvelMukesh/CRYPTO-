[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-intelligence"
version = "0.1.0"
description = "Production Cryptocurrency Intelligence, Market Scanner, Backtesting & Paper Trading Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Quantitative Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=43.0.0",
    "sse-starlette>=2.0.0",
    "prometheus-client>=0.20.0",
    "polars>=1.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "ccxt>=4.4.0",
    "structlog>=24.4.0",
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "pyyaml>=6.0.0",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "scikit-learn>=1.5.0",
]
research = [
    "scikit-learn>=1.5.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
